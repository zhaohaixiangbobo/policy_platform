# 文件说明：P4/P5同源入口；兼容ARM64宿主64KiB内存页，生产监听由Compose配置。
# Docker内置DNS运行时刷新上游，API暂停或重建时不导致Nginx启动失败。
resolver 127.0.0.11 valid=10s ipv6=off;
upstream platform_api {
    # Nginx要求zone至少8个内存页；64KiB页宿主下使用1MiB共享区。
    zone platform_api 1m;
    server api:8020 resolve;
}
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 100m;
    location = /healthz { access_log off; return 200 'ok'; }
    # 独立目录挂载支持宿主机原子替换JSON；配置错误时404，不回落为SPA HTML。
    location = /runtime/portal-config.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        etag off;
        if_modified_since off;
        try_files $uri =404;
    }
    location /api/ {
        proxy_pass http://platform_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        # 这是代理传输预算，不是问答SLA；长调用需结合现有客户端配置验证。
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    location / { try_files $uri $uri/ /index.html; }
}

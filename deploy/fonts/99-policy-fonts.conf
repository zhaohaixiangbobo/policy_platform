<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- 文件说明：公文字体名称归一；楷体_GB2312明确降级为用户授权的KaiTi。字体通过只读目录提供。 -->
<fontconfig>
  <cachedir>/tmp/policy-font-cache</cachedir>
  <alias binding="strong"><family>宋体</family><prefer><family>SimSun</family></prefer></alias>
  <alias binding="strong"><family>黑体</family><prefer><family>SimHei</family></prefer></alias>
  <alias binding="strong"><family>仿宋</family><prefer><family>FangSong</family></prefer></alias>
  <alias binding="strong"><family>仿宋_GB2312</family><prefer><family>FangSong_GB2312</family></prefer></alias>
  <alias binding="strong"><family>楷体</family><prefer><family>KaiTi</family></prefer></alias>
  <alias binding="strong"><family>楷体_GB2312</family><prefer><family>KaiTi</family></prefer></alias>
  <alias binding="strong"><family>KaiTi_GB2312</family><prefer><family>KaiTi</family></prefer></alias>
  <alias binding="strong"><family>方正小标宋简体</family><prefer><family>FZXiaoBiaoSong-B05S</family></prefer></alias>
</fontconfig>
